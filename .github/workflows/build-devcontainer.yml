name: Build Devcontainer Image

on:
  # workflow_dispatch lets you trigger the very first build by hand,
  # from Actions -> Build Devcontainer Image -> Run workflow.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .devcontainer/**
      - .github/workflows/build-devcontainer.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-devcontainer
  # Keep in sync with the NCS version in the Dockerfile.
  NCS_TAG: ncs-v3.4.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # The version tag is what devcontainer.json references; :latest is
          # a convenience only. Prebuilds pinned to a moving tag go stale silently.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.NCS_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
